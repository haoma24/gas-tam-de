# Local / MVP stack: NATS JetStream + Go services (SQLite files on ./data volume)
# + the Flutter Web site behind nginx.
# Usage (from repo root):
#   docker compose -f deploy/docker-compose.yml up --build
#
# Website  -> http://127.0.0.1:8090   (nginx serves Flutter Web, proxies /v1 + /healthz)
# Gateway  -> http://127.0.0.1:8080   (direct API access)
#
# Only nats / api-gateway / web publish host ports; the other Go services are
# reachable in-network through the gateway. `up nats` alone starts NATS only —
# use `up -d` (no service argument) for the whole stack.
#
# Every built service pins an explicit `image:` name. Without it compose derives
# the tag from the project name (`-p foo` => foo-catalog-service), so a build
# stage and a `up --no-build` stage that pass different -p values silently run a
# stale image from an earlier deploy. Pinning the name makes both stages agree,
# and turns a missing build into a loud "image not found" instead.
#
# IMAGE_PREFIX / IMAGE_TAG control which registry the VPS pulls from.
# Set these in deploy/.env (or host environment) for VPS deploys:
#   IMAGE_PREFIX=ghcr.io/haoma24/gas-tam-de
#   IMAGE_TAG=stag
# The GitHub Actions backend-ci.yml pushes those tags after every push to stag,
# so `docker compose -p ts-tamde-stag up -d --no-build` always gets fresh images.
# For local `make compose-up` (--build) IMAGE_PREFIX/IMAGE_TAG are not needed.

services:
  nats:
    image: nats:2.10-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - ./nats.conf:/etc/nats/nats.conf:ro
      - nats-data:/data/jetstream
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - gastamde

  api-gateway:
    image: ${IMAGE_PREFIX:-gas-tam-de}/api-gateway:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      args:
        SERVICE: api-gateway
        EXPOSE_PORT: "8080"
    environment:
      GATEWAY_ADDR: ":8080"
      GATEWAY_DB: "/data/gateway.db"
      CORS_ORIGINS: "http://localhost:*,http://127.0.0.1:*"
      JWT_SECRET: "${JWT_SECRET:-dev-jwt-secret-change-me}"
      RATE_LIMIT_OTP_PER_IP_MINUTE: "${RATE_LIMIT_OTP_PER_IP_MINUTE:-10}"
      RATE_LIMIT_LOGIN_PER_IP_MINUTE: "${RATE_LIMIT_LOGIN_PER_IP_MINUTE:-10}"
      RATE_LIMIT_ORDER_PER_IP_MINUTE: "${RATE_LIMIT_ORDER_PER_IP_MINUTE:-30}"
      RATE_LIMIT_ORDER_PER_USER_MINUTE: "${RATE_LIMIT_ORDER_PER_USER_MINUTE:-10}"
      AUTH_SERVICE_URL: "http://auth-service:8081"
      CATALOG_SERVICE_URL: "http://catalog-service:8082"
      GEO_SERVICE_URL: "http://geo-service:8083"
      ORDER_SERVICE_URL: "http://order-service:8084"
      INVENTORY_SERVICE_URL: "http://inventory-service:8085"
      BILLING_SERVICE_URL: "http://billing-service:8086"
      REPORT_SERVICE_URL: "http://report-service:8087"
      NATS_URL: "nats://nats:4222"
      NATS_STARTUP_TIMEOUT_SEC: "${NATS_STARTUP_TIMEOUT_SEC:-60}"
    volumes:
      - ../data:/data
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 90s
    depends_on:
      nats:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      geo-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      billing-service:
        condition: service_healthy
      report-service:
        condition: service_healthy
    networks:
      - gastamde

  auth-service:
    image: ${IMAGE_PREFIX:-gas-tam-de}/auth-service:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      args:
        SERVICE: auth-service
        EXPOSE_PORT: "8081"
    environment:
      AUTH_ADDR: ":8081"
      AUTH_DB: "/data/auth.db"
      NATS_URL: "nats://nats:4222"
      NATS_STARTUP_TIMEOUT_SEC: "${NATS_STARTUP_TIMEOUT_SEC:-60}"
      OTP_DEV_REVEAL: "${OTP_DEV_REVEAL:-1}"
      SMS_PROVIDER: "${SMS_PROVIDER:-mock}"
      SMS_VENDOR: "${SMS_VENDOR:-}"
      SMS_API_SID: "${SMS_API_SID:-}"
      SMS_API_SECRET: "${SMS_API_SECRET:-}"
      SMS_API_KEY: "${SMS_API_KEY:-}"
      SMS_API_URL: "${SMS_API_URL:-}"
      SMS_SENDER: "${SMS_SENDER:-}"
      SMS_TIMEOUT_SEC: "${SMS_TIMEOUT_SEC:-}"
      SMS_JWT_TTL_SEC: "${SMS_JWT_TTL_SEC:-}"
    volumes:
      - ../data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 90s
    depends_on:
      nats:
        condition: service_healthy
    networks:
      - gastamde

  catalog-service:
    image: ${IMAGE_PREFIX:-gas-tam-de}/catalog-service:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      args:
        SERVICE: catalog-service
        EXPOSE_PORT: "8082"
    environment:
      CATALOG_ADDR: ":8082"
      CATALOG_DB: "/data/catalog.db"
      NATS_URL: "nats://nats:4222"
      NATS_STARTUP_TIMEOUT_SEC: "${NATS_STARTUP_TIMEOUT_SEC:-60}"
    volumes:
      - ../data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8082/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 90s
    depends_on:
      nats:
        condition: service_healthy
    networks:
      - gastamde

  geo-service:
    image: ${IMAGE_PREFIX:-gas-tam-de}/geo-service:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      args:
        SERVICE: geo-service
        EXPOSE_PORT: "8083"
    environment:
      GEO_ADDR: ":8083"
      GEO_DB: "/data/geo.db"
      NATS_URL: "nats://nats:4222"
      NATS_STARTUP_TIMEOUT_SEC: "${NATS_STARTUP_TIMEOUT_SEC:-60}"
    volumes:
      - ../data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8083/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 90s
    depends_on:
      nats:
        condition: service_healthy
    networks:
      - gastamde

  order-service:
    image: ${IMAGE_PREFIX:-gas-tam-de}/order-service:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      args:
        SERVICE: order-service
        EXPOSE_PORT: "8084"
    environment:
      ORDER_ADDR: ":8084"
      ORDER_DB: "/data/order.db"
      GEO_SERVICE_URL: "http://geo-service:8083"
      CATALOG_SERVICE_URL: "http://catalog-service:8082"
      BILLING_SERVICE_URL: "http://billing-service:8086"
      NATS_URL: "nats://nats:4222"
      NATS_STARTUP_TIMEOUT_SEC: "${NATS_STARTUP_TIMEOUT_SEC:-60}"
    volumes:
      - ../data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8084/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 90s
    depends_on:
      nats:
        condition: service_healthy
      geo-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      billing-service:
        condition: service_healthy
    networks:
      - gastamde

  inventory-service:
    image: ${IMAGE_PREFIX:-gas-tam-de}/inventory-service:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      args:
        SERVICE: inventory-service
        EXPOSE_PORT: "8085"
    environment:
      INVENTORY_ADDR: ":8085"
      INVENTORY_DB: "/data/inventory.db"
      NATS_URL: "nats://nats:4222"
      NATS_STARTUP_TIMEOUT_SEC: "${NATS_STARTUP_TIMEOUT_SEC:-60}"
    volumes:
      - ../data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8085/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 90s
    depends_on:
      nats:
        condition: service_healthy
    networks:
      - gastamde

  billing-service:
    image: ${IMAGE_PREFIX:-gas-tam-de}/billing-service:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      args:
        SERVICE: billing-service
        EXPOSE_PORT: "8086"
    environment:
      BILLING_ADDR: ":8086"
      BILLING_DB: "/data/billing.db"
      NATS_URL: "nats://nats:4222"
      NATS_STARTUP_TIMEOUT_SEC: "${NATS_STARTUP_TIMEOUT_SEC:-60}"
    volumes:
      - ../data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8086/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 90s
    depends_on:
      nats:
        condition: service_healthy
    networks:
      - gastamde

  report-service:
    image: ${IMAGE_PREFIX:-gas-tam-de}/report-service:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      args:
        SERVICE: report-service
        EXPOSE_PORT: "8087"
    environment:
      REPORT_ADDR: ":8087"
      REPORT_DB: "/data/report.db"
      NATS_URL: "nats://nats:4222"
      NATS_STARTUP_TIMEOUT_SEC: "${NATS_STARTUP_TIMEOUT_SEC:-60}"
    volumes:
      - ../data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8087/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 90s
    depends_on:
      nats:
        condition: service_healthy
    networks:
      - gastamde

  # The website itself. Without this service `docker compose logs` only ever
  # showed infrastructure (NATS) and no frontend at all.
  web:
    image: ${IMAGE_PREFIX:-gas-tam-de}/web:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        FLUTTER_VERSION: "${FLUTTER_VERSION:-3.44.0}"
        API_BASE_URL: "${WEB_API_BASE_URL:-}"
    ports:
      - "${WEB_PORT:-8090}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/web-healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 90s
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - gastamde

volumes:
  nats-data:

networks:
  gastamde:
    driver: bridge
