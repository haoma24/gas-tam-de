# Local / MVP stack: NATS JetStream + Go services (SQLite files on ./data volume)
# + the Flutter Web site behind nginx.
#
# VPS / Coolify / Cursor Cloud Stage 5: chỉ load file này (KHÔNG docker-compose.local.yml).
# Image build chạy trên CI (push `:stag` lên GHCR). Stage `compose build` trên VPS phải
# no-op — nếu còn khối `build:` ở đây, platform sẽ build Flutter và dễ vỡ containerd.
# Local: `make compose-up` merge deploy/docker-compose.local.yml (có `build:` + host ports).
#
# Website  -> http://127.0.0.1:8090   (via docker-compose.local.yml; nginx :8080)
# Gateway  -> http://127.0.0.1:8080   (via docker-compose.local.yml)
#
# Coolify / Traefik (VPS Stage 8) — labeledPort=8080 rules:
# 1) Mọi service join **tensorship-net** (external) + default để nginx trong `web`
#    resolve `api-gateway` khi platform chỉ route Traefik qua proxy network.
# 2) Do NOT `ports:`-publish any service Traefik targets. Host publish adds
#    another endpoint; Traefik often picks it → Unreachable. Use `expose`
#    only; local host ports live in docker-compose.local.yml.
# 3) Public Traefik target is **web** (nginx) on container port **8080**, not
#    api-gateway. Labels: traefik.docker.network=tensorship-net (literal).
# Local: `make compose-up` tạo tensorship-net giả nếu chưa có (`ensure-proxy-net`).
# `scripts/vps-net-check.sh` repairs NotOnNet attach failures.

x-stack-networks: &stack_networks
  - default
  - tensorship-net

services:
  nats:
    networks: *stack_networks
    image: nats:2.10-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    # No host ports here — Coolify/Traefik; local maps in docker-compose.local.yml.
    expose:
      - "4222"
      - "8222"
    volumes:
      - ./nats.conf:/etc/nats/nats.conf:ro
      - nats-data:/data/jetstream
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api-gateway:
    networks: *stack_networks
    image: ghcr.io/haoma24/gas-tam-de/api-gateway:stag
    # Internal only for Traefik. Stage 8 probes **web:8080** (nginx). Gateway
    # still binds 0.0.0.0:8080 immediately (healthz before SQLite) for nginx
    # proxy + compose healthchecks. No host `ports:` — see docker-compose.local.yml.
    expose:
      - "8080"
    labels:
      - traefik.enable=true
      - traefik.docker.network=tensorship-net
      # Public /v1 on the same hostname (bypasses static/nginx frontends that
      # only serve Flutter and return index.html or 405 for POST /v1/*).
      - traefik.http.services.gastamde-api.loadbalancer.server.port=8080
      - traefik.http.routers.gastamde-api.rule=PathPrefix(`/v1`) || Path(`/gateway-healthz`)
      - traefik.http.routers.gastamde-api.priority=200
      - traefik.http.routers.gastamde-api.service=gastamde-api
    environment:
      PORT: "8080"
      GATEWAY_ADDR: "0.0.0.0:8080"
      GATEWAY_DB: "/data/gateway.db"
      SWAGGER_ENABLED: "${SWAGGER_ENABLED:-0}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:*,http://127.0.0.1:*,https://tamde-stag.tinhgon.xyz}"
      JWT_SECRET: "${JWT_SECRET:-dev-jwt-secret-change-me}"
      RATE_LIMIT_OTP_PER_IP_MINUTE: "${RATE_LIMIT_OTP_PER_IP_MINUTE:-10}"
      RATE_LIMIT_LOGIN_PER_IP_MINUTE: "${RATE_LIMIT_LOGIN_PER_IP_MINUTE:-10}"
      RATE_LIMIT_ORDER_PER_IP_MINUTE: "${RATE_LIMIT_ORDER_PER_IP_MINUTE:-30}"
      RATE_LIMIT_ORDER_PER_USER_MINUTE: "${RATE_LIMIT_ORDER_PER_USER_MINUTE:-10}"
      AUTH_SERVICE_URL: "http://auth-service:8081"
      CATALOG_SERVICE_URL: "http://catalog-service:8082"
      GEO_SERVICE_URL: "http://geo-service:8083"
      ORDER_SERVICE_URL: "http://order-service:8084"
      INVENTORY_SERVICE_URL: "http://inventory-service:8085"
      BILLING_SERVICE_URL: "http://billing-service:8086"
      REPORT_SERVICE_URL: "http://report-service:8087"
      NATS_URL: "nats://nats:4222"
      NATS_STARTUP_TIMEOUT_SEC: "${NATS_STARTUP_TIMEOUT_SEC:-60}"
    volumes:
      - ../data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    depends_on:
      auth-service:
        condition: service_healthy

  auth-service:
    networks: *stack_networks
    image: ghcr.io/haoma24/gas-tam-de/auth-service:stag
    environment:
      AUTH_ADDR: ":8081"
      AUTH_DB: "/data/auth.db"
      # auth-service signs the access JWT, api-gateway (standalone + the one
      # embedded in `web`) verifies it. All three must read the same
      # JWT_SECRET/TTL or every authenticated call 401s with
      # "invalid or expired access token" even right after a successful login.
      # Compare the `jwt_secret_fp` line in each container's startup log.
      JWT_SECRET: "${JWT_SECRET:-dev-jwt-secret-change-me}"
      JWT_ACCESS_TTL_SEC: "${JWT_ACCESS_TTL_SEC:-900}"
      JWT_REFRESH_TTL_SEC: "${JWT_REFRESH_TTL_SEC:-2592000}"
      # Comma-separated OAuth client IDs accepted in Google ID-token `aud`.
      GOOGLE_CLIENT_IDS: "${GOOGLE_CLIENT_IDS:-}"
      # PHONE_ENC_KEY / PHONE_HASH_PEPPER are deliberately NOT wired here:
      # phone_hash is the customer identity key, so changing the pepper on a
      # live auth.db orphans every existing user and their order history.
      OTP_HASH_PEPPER: "${OTP_HASH_PEPPER:-dev-otp-hash-pepper-change-me}"
      OTP_TTL_SEC: "${OTP_TTL_SEC:-300}"
      OTP_COOLDOWN_SEC: "${OTP_COOLDOWN_SEC:-60}"
      OTP_MAX_PER_PHONE_HOUR: "${OTP_MAX_PER_PHONE_HOUR:-5}"
      OTP_MAX_PER_IP_HOUR: "${OTP_MAX_PER_IP_HOUR:-20}"
      OTP_MAX_ATTEMPTS: "${OTP_MAX_ATTEMPTS:-5}"
      ADMIN_SEED: "${ADMIN_SEED:-1}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-admin-change-me}"
      ADMIN_DISPLAY_NAME: "${ADMIN_DISPLAY_NAME:-Admin}"
      # Phones that get role=admin after a normal OTP login (comma-separated).
      # Editable at runtime from Quản trị → Số điện thoại admin.
      ADMIN_PHONES: "${ADMIN_PHONES:-0909777020}"
      NATS_URL: "nats://nats:4222"
      NATS_STARTUP_TIMEOUT_SEC: "${NATS_STARTUP_TIMEOUT_SEC:-60}"
      # Off by default: with this on, /v1/auth/otp/request returns the code in
      # its JSON response, so anyone who can reach the endpoint can log in as
      # any phone number. docker-compose.local.yml turns it back on for local
      # development, where no real SMS is sent.
      OTP_DEV_REVEAL: "${OTP_DEV_REVEAL:-0}"
      SMS_PROVIDER: "${SMS_PROVIDER:-mock}"
      SMS_VENDOR: "${SMS_VENDOR:-}"
      SMS_API_SID: "${SMS_API_SID:-}"
      SMS_API_SECRET: "${SMS_API_SECRET:-}"
      SMS_API_KEY: "${SMS_API_KEY:-}"
      SMS_API_URL: "${SMS_API_URL:-}"
      SMS_SENDER: "${SMS_SENDER:-}"
      SMS_TIMEOUT_SEC: "${SMS_TIMEOUT_SEC:-}"
      SMS_JWT_TTL_SEC: "${SMS_JWT_TTL_SEC:-}"
    volumes:
      - ../data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 90s
    depends_on:
      nats:
        condition: service_healthy

  catalog-service:
    networks: *stack_networks
    image: ghcr.io/haoma24/gas-tam-de/catalog-service:stag
    environment:
      CATALOG_ADDR: ":8082"
      CATALOG_DB: "/data/catalog.db"
      NATS_URL: "nats://nats:4222"
      NATS_STARTUP_TIMEOUT_SEC: "${NATS_STARTUP_TIMEOUT_SEC:-60}"
    volumes:
      - ../data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8082/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 90s
    depends_on:
      nats:
        condition: service_healthy

  geo-service:
    networks: *stack_networks
    image: ghcr.io/haoma24/gas-tam-de/geo-service:stag
    environment:
      GEO_ADDR: ":8083"
      GEO_DB: "/data/geo.db"
      NATS_URL: "nats://nats:4222"
      NATS_STARTUP_TIMEOUT_SEC: "${NATS_STARTUP_TIMEOUT_SEC:-60}"
    volumes:
      - ../data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8083/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 90s
    depends_on:
      nats:
        condition: service_healthy

  order-service:
    networks: *stack_networks
    image: ghcr.io/haoma24/gas-tam-de/order-service:stag
    environment:
      ORDER_ADDR: ":8084"
      ORDER_DB: "/data/order.db"
      GEO_SERVICE_URL: "http://geo-service:8083"
      CATALOG_SERVICE_URL: "http://catalog-service:8082"
      BILLING_SERVICE_URL: "http://billing-service:8086"
      INVENTORY_SERVICE_URL: "http://inventory-service:8085"
      NATS_URL: "nats://nats:4222"
      NATS_STARTUP_TIMEOUT_SEC: "${NATS_STARTUP_TIMEOUT_SEC:-60}"
    volumes:
      - ../data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8084/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 90s
    depends_on:
      nats:
        condition: service_healthy
      geo-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      billing-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy

  inventory-service:
    networks: *stack_networks
    image: ghcr.io/haoma24/gas-tam-de/inventory-service:stag
    environment:
      INVENTORY_ADDR: ":8085"
      INVENTORY_DB: "/data/inventory.db"
      NATS_URL: "nats://nats:4222"
      NATS_STARTUP_TIMEOUT_SEC: "${NATS_STARTUP_TIMEOUT_SEC:-60}"
    volumes:
      - ../data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8085/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 90s
    depends_on:
      nats:
        condition: service_healthy

  billing-service:
    networks: *stack_networks
    image: ghcr.io/haoma24/gas-tam-de/billing-service:stag
    environment:
      BILLING_ADDR: ":8086"
      BILLING_DB: "/data/billing.db"
      NATS_URL: "nats://nats:4222"
      NATS_STARTUP_TIMEOUT_SEC: "${NATS_STARTUP_TIMEOUT_SEC:-60}"
    volumes:
      - ../data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8086/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 90s
    depends_on:
      nats:
        condition: service_healthy

  report-service:
    networks: *stack_networks
    image: ghcr.io/haoma24/gas-tam-de/report-service:stag
    environment:
      REPORT_ADDR: ":8087"
      REPORT_DB: "/data/report.db"
      NATS_URL: "nats://nats:4222"
      NATS_STARTUP_TIMEOUT_SEC: "${NATS_STARTUP_TIMEOUT_SEC:-60}"
    volumes:
      - ../data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8087/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 90s
    depends_on:
      nats:
        condition: service_healthy

  # Public Traefik target (Stage 8 labeledPort=8080). nginx :8080 + embedded
  # api-gateway on 127.0.0.1:8081 (no separate api-gateway container required).
  web:
    networks: *stack_networks
    image: ghcr.io/haoma24/gas-tam-de/web:stag
    # Do NOT ports-publish here (Traefik Unreachable). Local: docker-compose.local.yml
    labels:
      - traefik.enable=true
      - traefik.http.services.web.loadbalancer.server.port=8080
      - traefik.docker.network=tensorship-net
    expose:
      - "8080"
    environment:
      GATEWAY_ADDR: "127.0.0.1:8081"
      GATEWAY_DB: "/data/gateway.db"
      SWAGGER_ENABLED: "${SWAGGER_ENABLED:-0}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:*,http://127.0.0.1:*,https://tamde-stag.tinhgon.xyz}"
      JWT_SECRET: "${JWT_SECRET:-dev-jwt-secret-change-me}"
      RATE_LIMIT_OTP_PER_IP_MINUTE: "${RATE_LIMIT_OTP_PER_IP_MINUTE:-10}"
      RATE_LIMIT_LOGIN_PER_IP_MINUTE: "${RATE_LIMIT_LOGIN_PER_IP_MINUTE:-10}"
      RATE_LIMIT_ORDER_PER_IP_MINUTE: "${RATE_LIMIT_ORDER_PER_IP_MINUTE:-30}"
      RATE_LIMIT_ORDER_PER_USER_MINUTE: "${RATE_LIMIT_ORDER_PER_USER_MINUTE:-10}"
      AUTH_SERVICE_URL: "http://auth-service:8081"
      CATALOG_SERVICE_URL: "http://catalog-service:8082"
      GEO_SERVICE_URL: "http://geo-service:8083"
      ORDER_SERVICE_URL: "http://order-service:8084"
      INVENTORY_SERVICE_URL: "http://inventory-service:8085"
      BILLING_SERVICE_URL: "http://billing-service:8086"
      REPORT_SERVICE_URL: "http://report-service:8087"
      NATS_URL: "nats://nats:4222"
      NATS_STARTUP_TIMEOUT_SEC: "${NATS_STARTUP_TIMEOUT_SEC:-60}"
    volumes:
      - ../data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/gateway-healthz"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 120s
    depends_on:
      auth-service:
        condition: service_healthy

volumes:
  nats-data:

networks:
  tensorship-net:
    external: true
    name: ${PROXY_NETWORK:-tensorship-net}
