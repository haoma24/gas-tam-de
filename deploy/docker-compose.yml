# Local / MVP stack: NATS JetStream + Go services (SQLite files on ./data volume)
# + the Flutter Web site behind nginx.
# Usage (from repo root):
#   docker compose -f deploy/docker-compose.yml up --build
#
# Website  -> http://127.0.0.1:8090   (nginx serves Flutter Web, proxies /v1 + /healthz)
# Gateway  -> http://127.0.0.1:8080   (direct API access)
#
# Only nats / api-gateway / web publish host ports; the other Go services are
# reachable in-network through the gateway. `up nats` alone starts NATS only —
# use `up -d` (no service argument) for the whole stack.
#
# Every built service pins an explicit `image:` name so a build stage and a
# `up --no-build` stage that pass different -p values never silently run a
# stale image. Images are published to GHCR by backend-ci.yml on every push
# to stag; `up --no-build` pulls them directly. Local `make compose-up`
# (--build) rebuilds fresh and re-tags the image with the same name.
#
# Coolify / Traefik (VPS Stage 8) — three rules that keep labeledPort=8080 reachable:
# 1) Do NOT define custom `networks:` (Coolify attaches its own + Traefik).
# 2) Do NOT `ports:`-publish the Traefik target (api-gateway:8080). Host publish
#    adds another endpoint; Traefik often picks it → Unreachable. Use `expose`
#    only; local host ports live in docker-compose.local.yml.
# 3) Set `traefik.docker.network=tensorship-net` (literal) so Traefik uses the
#    proxy-net IP when the container is on two networks.
# `scripts/vps-net-check.sh` repairs NotOnNet attach failures.

services:
  nats:
    image: nats:2.10-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - ./nats.conf:/etc/nats/nats.conf:ro
      - nats-data:/data/jetstream
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api-gateway:
    image: ghcr.io/haoma24/gas-tam-de/api-gateway:stag
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      args:
        SERVICE: api-gateway
        EXPOSE_PORT: "8080"
    # Coolify/Traefik Stage 8 (labeledPort=8080):
    # - Do NOT publish host ports here. `ports: "8080:8080"` puts the container
    #   on an extra ingress/publish endpoint; Traefik then often picks that IP
    #   and reports Unreachable even when the process listens on 0.0.0.0:8080.
    #   Local host mapping lives in docker-compose.local.yml.
    # - traefik.docker.network MUST be the real Docker network name (hardcoded;
    #   ${VAR} in labels is easy for the platform to leave unexpanded).
    # - No depends_on: gateway /healthz is liveness-only; start immediately so
    #   Stage 8 can connect while backends are still pulling/starting.
    labels:
      - traefik.enable=true
      - traefik.http.services.api-gateway.loadbalancer.server.port=8080
      - traefik.docker.network=tensorship-net
    expose:
      - "8080"
    environment:
      PORT: "8080"
      GATEWAY_ADDR: "0.0.0.0:8080"
      GATEWAY_DB: "/data/gateway.db"
      CORS_ORIGINS: "http://localhost:*,http://127.0.0.1:*"
      JWT_SECRET: "${JWT_SECRET:-dev-jwt-secret-change-me}"
      RATE_LIMIT_OTP_PER_IP_MINUTE: "${RATE_LIMIT_OTP_PER_IP_MINUTE:-10}"
      RATE_LIMIT_LOGIN_PER_IP_MINUTE: "${RATE_LIMIT_LOGIN_PER_IP_MINUTE:-10}"
      RATE_LIMIT_ORDER_PER_IP_MINUTE: "${RATE_LIMIT_ORDER_PER_IP_MINUTE:-30}"
      RATE_LIMIT_ORDER_PER_USER_MINUTE: "${RATE_LIMIT_ORDER_PER_USER_MINUTE:-10}"
      AUTH_SERVICE_URL: "http://auth-service:8081"
      CATALOG_SERVICE_URL: "http://catalog-service:8082"
      GEO_SERVICE_URL: "http://geo-service:8083"
      ORDER_SERVICE_URL: "http://order-service:8084"
      INVENTORY_SERVICE_URL: "http://inventory-service:8085"
      BILLING_SERVICE_URL: "http://billing-service:8086"
      REPORT_SERVICE_URL: "http://report-service:8087"
      NATS_URL: "nats://nats:4222"
      NATS_STARTUP_TIMEOUT_SEC: "${NATS_STARTUP_TIMEOUT_SEC:-60}"
    volumes:
      - ../data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

  auth-service:
    image: ghcr.io/haoma24/gas-tam-de/auth-service:stag
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      args:
        SERVICE: auth-service
        EXPOSE_PORT: "8081"
    environment:
      AUTH_ADDR: ":8081"
      AUTH_DB: "/data/auth.db"
      NATS_URL: "nats://nats:4222"
      NATS_STARTUP_TIMEOUT_SEC: "${NATS_STARTUP_TIMEOUT_SEC:-60}"
      OTP_DEV_REVEAL: "${OTP_DEV_REVEAL:-1}"
      SMS_PROVIDER: "${SMS_PROVIDER:-mock}"
      SMS_VENDOR: "${SMS_VENDOR:-}"
      SMS_API_SID: "${SMS_API_SID:-}"
      SMS_API_SECRET: "${SMS_API_SECRET:-}"
      SMS_API_KEY: "${SMS_API_KEY:-}"
      SMS_API_URL: "${SMS_API_URL:-}"
      SMS_SENDER: "${SMS_SENDER:-}"
      SMS_TIMEOUT_SEC: "${SMS_TIMEOUT_SEC:-}"
      SMS_JWT_TTL_SEC: "${SMS_JWT_TTL_SEC:-}"
    volumes:
      - ../data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 90s
    depends_on:
      nats:
        condition: service_healthy

  catalog-service:
    image: ghcr.io/haoma24/gas-tam-de/catalog-service:stag
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      args:
        SERVICE: catalog-service
        EXPOSE_PORT: "8082"
    environment:
      CATALOG_ADDR: ":8082"
      CATALOG_DB: "/data/catalog.db"
      NATS_URL: "nats://nats:4222"
      NATS_STARTUP_TIMEOUT_SEC: "${NATS_STARTUP_TIMEOUT_SEC:-60}"
    volumes:
      - ../data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8082/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 90s
    depends_on:
      nats:
        condition: service_healthy

  geo-service:
    image: ghcr.io/haoma24/gas-tam-de/geo-service:stag
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      args:
        SERVICE: geo-service
        EXPOSE_PORT: "8083"
    environment:
      GEO_ADDR: ":8083"
      GEO_DB: "/data/geo.db"
      NATS_URL: "nats://nats:4222"
      NATS_STARTUP_TIMEOUT_SEC: "${NATS_STARTUP_TIMEOUT_SEC:-60}"
    volumes:
      - ../data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8083/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 90s
    depends_on:
      nats:
        condition: service_healthy

  order-service:
    image: ghcr.io/haoma24/gas-tam-de/order-service:stag
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      args:
        SERVICE: order-service
        EXPOSE_PORT: "8084"
    environment:
      ORDER_ADDR: ":8084"
      ORDER_DB: "/data/order.db"
      GEO_SERVICE_URL: "http://geo-service:8083"
      CATALOG_SERVICE_URL: "http://catalog-service:8082"
      BILLING_SERVICE_URL: "http://billing-service:8086"
      NATS_URL: "nats://nats:4222"
      NATS_STARTUP_TIMEOUT_SEC: "${NATS_STARTUP_TIMEOUT_SEC:-60}"
    volumes:
      - ../data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8084/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 90s
    depends_on:
      nats:
        condition: service_healthy
      geo-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      billing-service:
        condition: service_healthy

  inventory-service:
    image: ghcr.io/haoma24/gas-tam-de/inventory-service:stag
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      args:
        SERVICE: inventory-service
        EXPOSE_PORT: "8085"
    environment:
      INVENTORY_ADDR: ":8085"
      INVENTORY_DB: "/data/inventory.db"
      NATS_URL: "nats://nats:4222"
      NATS_STARTUP_TIMEOUT_SEC: "${NATS_STARTUP_TIMEOUT_SEC:-60}"
    volumes:
      - ../data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8085/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 90s
    depends_on:
      nats:
        condition: service_healthy

  billing-service:
    image: ghcr.io/haoma24/gas-tam-de/billing-service:stag
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      args:
        SERVICE: billing-service
        EXPOSE_PORT: "8086"
    environment:
      BILLING_ADDR: ":8086"
      BILLING_DB: "/data/billing.db"
      NATS_URL: "nats://nats:4222"
      NATS_STARTUP_TIMEOUT_SEC: "${NATS_STARTUP_TIMEOUT_SEC:-60}"
    volumes:
      - ../data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8086/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 90s
    depends_on:
      nats:
        condition: service_healthy

  report-service:
    image: ghcr.io/haoma24/gas-tam-de/report-service:stag
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      args:
        SERVICE: report-service
        EXPOSE_PORT: "8087"
    environment:
      REPORT_ADDR: ":8087"
      REPORT_DB: "/data/report.db"
      NATS_URL: "nats://nats:4222"
      NATS_STARTUP_TIMEOUT_SEC: "${NATS_STARTUP_TIMEOUT_SEC:-60}"
    volumes:
      - ../data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8087/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 90s
    depends_on:
      nats:
        condition: service_healthy

  # The website itself. Without this service `docker compose logs` only ever
  # showed infrastructure (NATS) and no frontend at all.
  web:
    image: ghcr.io/haoma24/gas-tam-de/web:stag
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        FLUTTER_VERSION: "${FLUTTER_VERSION:-3.44.0}"
        API_BASE_URL: "${WEB_API_BASE_URL:-}"
    ports:
      - "${WEB_PORT:-8090}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/web-healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 90s
    # service_started, not service_healthy: nginx resolves api-gateway per
    # request (see nginx.web.conf), so the site can serve while the gateway is
    # still booting. Waiting for healthy left the web container in `created`
    # state whenever the gateway was slow, which the platform proxy reads as an
    # app that never came up.
    depends_on:
      api-gateway:
        condition: service_started

volumes:
  nats-data:

