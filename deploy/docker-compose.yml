# Local / MVP stack: NATS JetStream + Go services (SQLite files on ./data volume)
# + the Flutter Web site behind nginx.
#
# VPS / Coolify / Cursor Cloud Stage 5: chỉ load file này (KHÔNG docker-compose.local.yml).
# Image build chạy trên CI (push `:stag` lên GHCR). Stage `compose build` trên VPS phải
# no-op — nếu còn khối `build:` ở đây, platform sẽ build Flutter và dễ vỡ containerd.
# Local: `make compose-up` merge deploy/docker-compose.local.yml (có `build:` + host ports).
#
# Website  -> http://127.0.0.1:8090   (via docker-compose.local.yml; nginx :8080)
# Gateway  -> http://127.0.0.1:8080   (via docker-compose.local.yml)
#
# Coolify / Traefik (VPS Stage 8) — labeledPort=8080 rules:
# 1) Do NOT define custom `networks:` (Coolify attaches its own + Traefik).
# 2) Do NOT `ports:`-publish any service Traefik targets. Host publish adds
#    another endpoint; Traefik often picks it → Unreachable. Use `expose`
#    only; local host ports live in docker-compose.local.yml.
# 3) Public Traefik target is **web** (nginx) on container port **8080**, not
#    api-gateway. nginx listens instantly; gateway may still be opening SQLite.
#    Labels: traefik.docker.network=tensorship-net (literal).
# `scripts/vps-net-check.sh` repairs NotOnNet attach failures.

services:
  nats:
    image: nats:2.10-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    # No host ports here — Coolify/Traefik; local maps in docker-compose.local.yml.
    expose:
      - "4222"
      - "8222"
    volumes:
      - ./nats.conf:/etc/nats/nats.conf:ro
      - nats-data:/data/jetstream
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api-gateway:
    image: ghcr.io/haoma24/gas-tam-de/api-gateway:stag
    # Internal only for Traefik. Stage 8 probes **web:8080** (nginx). Gateway
    # still binds 0.0.0.0:8080 immediately (healthz before SQLite) for nginx
    # proxy + compose healthchecks. No host `ports:` — see docker-compose.local.yml.
    expose:
      - "8080"
    environment:
      PORT: "8080"
      GATEWAY_ADDR: "0.0.0.0:8080"
      GATEWAY_DB: "/data/gateway.db"
      CORS_ORIGINS: "http://localhost:*,http://127.0.0.1:*"
      JWT_SECRET: "${JWT_SECRET:-dev-jwt-secret-change-me}"
      RATE_LIMIT_OTP_PER_IP_MINUTE: "${RATE_LIMIT_OTP_PER_IP_MINUTE:-10}"
      RATE_LIMIT_LOGIN_PER_IP_MINUTE: "${RATE_LIMIT_LOGIN_PER_IP_MINUTE:-10}"
      RATE_LIMIT_ORDER_PER_IP_MINUTE: "${RATE_LIMIT_ORDER_PER_IP_MINUTE:-30}"
      RATE_LIMIT_ORDER_PER_USER_MINUTE: "${RATE_LIMIT_ORDER_PER_USER_MINUTE:-10}"
      AUTH_SERVICE_URL: "http://auth-service:8081"
      CATALOG_SERVICE_URL: "http://catalog-service:8082"
      GEO_SERVICE_URL: "http://geo-service:8083"
      ORDER_SERVICE_URL: "http://order-service:8084"
      INVENTORY_SERVICE_URL: "http://inventory-service:8085"
      BILLING_SERVICE_URL: "http://billing-service:8086"
      REPORT_SERVICE_URL: "http://report-service:8087"
      NATS_URL: "nats://nats:4222"
      NATS_STARTUP_TIMEOUT_SEC: "${NATS_STARTUP_TIMEOUT_SEC:-60}"
    volumes:
      - ../data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    depends_on:
      auth-service:
        condition: service_healthy

  auth-service:
    image: ghcr.io/haoma24/gas-tam-de/auth-service:stag
    environment:
      AUTH_ADDR: ":8081"
      AUTH_DB: "/data/auth.db"
      NATS_URL: "nats://nats:4222"
      NATS_STARTUP_TIMEOUT_SEC: "${NATS_STARTUP_TIMEOUT_SEC:-60}"
      OTP_DEV_REVEAL: "${OTP_DEV_REVEAL:-1}"
      SMS_PROVIDER: "${SMS_PROVIDER:-mock}"
      SMS_VENDOR: "${SMS_VENDOR:-}"
      SMS_API_SID: "${SMS_API_SID:-}"
      SMS_API_SECRET: "${SMS_API_SECRET:-}"
      SMS_API_KEY: "${SMS_API_KEY:-}"
      SMS_API_URL: "${SMS_API_URL:-}"
      SMS_SENDER: "${SMS_SENDER:-}"
      SMS_TIMEOUT_SEC: "${SMS_TIMEOUT_SEC:-}"
      SMS_JWT_TTL_SEC: "${SMS_JWT_TTL_SEC:-}"
    volumes:
      - ../data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 90s
    depends_on:
      nats:
        condition: service_healthy

  catalog-service:
    image: ghcr.io/haoma24/gas-tam-de/catalog-service:stag
    environment:
      CATALOG_ADDR: ":8082"
      CATALOG_DB: "/data/catalog.db"
      NATS_URL: "nats://nats:4222"
      NATS_STARTUP_TIMEOUT_SEC: "${NATS_STARTUP_TIMEOUT_SEC:-60}"
    volumes:
      - ../data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8082/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 90s
    depends_on:
      nats:
        condition: service_healthy

  geo-service:
    image: ghcr.io/haoma24/gas-tam-de/geo-service:stag
    environment:
      GEO_ADDR: ":8083"
      GEO_DB: "/data/geo.db"
      NATS_URL: "nats://nats:4222"
      NATS_STARTUP_TIMEOUT_SEC: "${NATS_STARTUP_TIMEOUT_SEC:-60}"
    volumes:
      - ../data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8083/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 90s
    depends_on:
      nats:
        condition: service_healthy

  order-service:
    image: ghcr.io/haoma24/gas-tam-de/order-service:stag
    environment:
      ORDER_ADDR: ":8084"
      ORDER_DB: "/data/order.db"
      GEO_SERVICE_URL: "http://geo-service:8083"
      CATALOG_SERVICE_URL: "http://catalog-service:8082"
      BILLING_SERVICE_URL: "http://billing-service:8086"
      NATS_URL: "nats://nats:4222"
      NATS_STARTUP_TIMEOUT_SEC: "${NATS_STARTUP_TIMEOUT_SEC:-60}"
    volumes:
      - ../data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8084/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 90s
    depends_on:
      nats:
        condition: service_healthy
      geo-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      billing-service:
        condition: service_healthy

  inventory-service:
    image: ghcr.io/haoma24/gas-tam-de/inventory-service:stag
    environment:
      INVENTORY_ADDR: ":8085"
      INVENTORY_DB: "/data/inventory.db"
      NATS_URL: "nats://nats:4222"
      NATS_STARTUP_TIMEOUT_SEC: "${NATS_STARTUP_TIMEOUT_SEC:-60}"
    volumes:
      - ../data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8085/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 90s
    depends_on:
      nats:
        condition: service_healthy

  billing-service:
    image: ghcr.io/haoma24/gas-tam-de/billing-service:stag
    environment:
      BILLING_ADDR: ":8086"
      BILLING_DB: "/data/billing.db"
      NATS_URL: "nats://nats:4222"
      NATS_STARTUP_TIMEOUT_SEC: "${NATS_STARTUP_TIMEOUT_SEC:-60}"
    volumes:
      - ../data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8086/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 90s
    depends_on:
      nats:
        condition: service_healthy

  report-service:
    image: ghcr.io/haoma24/gas-tam-de/report-service:stag
    environment:
      REPORT_ADDR: ":8087"
      REPORT_DB: "/data/report.db"
      NATS_URL: "nats://nats:4222"
      NATS_STARTUP_TIMEOUT_SEC: "${NATS_STARTUP_TIMEOUT_SEC:-60}"
    volumes:
      - ../data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8087/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 90s
    depends_on:
      nats:
        condition: service_healthy

  # Public Traefik target (Stage 8 labeledPort=8080). nginx listens on 8080
  # immediately and serves /healthz itself; /v1/* proxies to api-gateway.
  web:
    image: ghcr.io/haoma24/gas-tam-de/web:stag
    # Do NOT ports-publish here (Traefik Unreachable). Local: docker-compose.local.yml
    labels:
      - traefik.enable=true
      - traefik.http.services.web.loadbalancer.server.port=8080
      - traefik.docker.network=tensorship-net
    expose:
      - "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/web-healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    # Pull the OTP path (nats → auth → gateway) whenever web starts locally or
    # on VPS. nginx returns api_unavailable when api-gateway is unreachable;
    # auth must be up or /v1/auth/* fails with BAD_GATEWAY even if gateway runs.
    depends_on:
      api-gateway:
        condition: service_healthy
      auth-service:
        condition: service_healthy

volumes:
  nats-data:
