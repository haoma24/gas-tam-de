# Local NATS JetStream for Gas Tam Đệ (dev / MVP).
# Monitoring on 8222; client on 4222 (compose maps both).

server_name: gas-tam-de-nats

port: 4222
http_port: 8222

jetstream {
  store_dir: /data/jetstream
  # Dev-friendly limits; raise for production VPS later.
  max_mem_store: 256MB
  max_file_store: 1GB
}
