# Serves the Flutter Web build and reverse-proxies the API to the embedded
# api-gateway on 127.0.0.1:8081 (see deploy/docker-entrypoint.web.sh).

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm image/svg+xml font/woff2;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok","service":"web"}';
    }

    location = /web-healthz {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok","service":"web"}';
    }

    location = /gateway-healthz {
        proxy_pass http://127.0.0.1:8081/healthz;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        error_page 502 503 504 = @api_unavailable;
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:8081$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
        error_page 502 503 504 = @api_unavailable;
    }

    location @api_unavailable {
        default_type application/json;
        return 503 '{"error":{"code":"api_unavailable","message":"API gateway khong san sang"}}';
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
