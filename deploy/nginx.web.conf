# Serves the Flutter Web build and reverse-proxies the API to api-gateway:8080.
# Same-origin proxying keeps the browser off CORS preflight entirely.

server {
    # Traefik / Stage 8 labeledPort=8080 targets this container. Listen on 8080
    # (not 80) so the platform probe matches EXPOSE + loadbalancer.server.port.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS, queried per request instead of once at startup.
    # A literal `proxy_pass http://api-gateway:8080` is resolved while parsing
    # the config, so nginx exits with "host not found in upstream api-gateway"
    # whenever the gateway container is not running yet — after a host or daemon
    # restart the restart policy brings containers back in any order, ignoring
    # depends_on. The crash-looping container then sits in `restarting` state,
    # where `docker network connect` fails and the platform proxy reports the
    # app as not attached to its network. Resolving at request time keeps the
    # site up and downgrades a missing gateway to a 503 body.
    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 5s;
    set $api_gateway http://api-gateway:8080;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm image/svg+xml font/woff2;
    gzip_min_length 1024;

    # Liveness for Traefik / compose — answers from nginx itself so Stage 8
    # stays green even while api-gateway is still opening SQLite. Unlogged.
    location = /healthz {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok","service":"web"}';
    }

    location = /web-healthz {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok","service":"web"}';
    }

    # Optional: probe the gateway through nginx (not used by Stage 8).
    location = /gateway-healthz {
        proxy_pass $api_gateway/healthz;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        error_page 502 503 504 = @api_unavailable;
    }

    location /v1/ {
        proxy_pass $api_gateway$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
        error_page 502 503 504 = @api_unavailable;
    }

    # Only reached when nginx itself cannot reach the gateway (DNS or connect
    # failure); upstream error responses are passed through untouched.
    location @api_unavailable {
        default_type application/json;
        return 503 '{"error":{"code":"api_unavailable","message":"API gateway khong san sang"}}';
    }

    # Revalidate the app shell so a redeploy is picked up without a hard reload.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
