# Composite: normalize GCP SSH secrets then run appleboy/ssh-action.
#
# Caller must `actions/checkout` first (required for `uses: ./...`).
#
# Secrets / inputs:
#   host, username, key — from GCP_VM_HOST / GCP_VM_USER / GCP_VM_SSH_KEY
# Optional:
#   passphrase — GCP_VM_SSH_PASSPHRASE when the private key is encrypted
name: SSH deploy to GCP stag
description: Normalize GitHub SSH secrets and deploy via appleboy/ssh-action

inputs:
  host:
    description: GCP VM host / IP
    required: true
  username:
    description: SSH username on the VM
    required: true
  key:
    description: SSH private key material
    required: true
  passphrase:
    description: Passphrase for encrypted private key (optional)
    required: false
    default: ""
  script:
    description: Remote shell script to run after connect
    required: true

runs:
  using: composite
  steps:
    - name: Normalize & validate SSH key
      shell: bash
      env:
        GCP_VM_HOST: ${{ inputs.host }}
        GCP_VM_USER: ${{ inputs.username }}
        GCP_VM_SSH_KEY: ${{ inputs.key }}
      run: |
        set -euo pipefail
        chmod +x scripts/ci-normalize-ssh-key.sh
        scripts/ci-normalize-ssh-key.sh "${RUNNER_TEMP}/gcp_deploy_key"

    - name: SSH deploy
      id: ssh
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ inputs.host }}
        username: ${{ inputs.username }}
        key_path: ${{ runner.temp }}/gcp_deploy_key
        passphrase: ${{ inputs.passphrase }}
        timeout: 120s
        command_timeout: 300s
        script: ${{ inputs.script }}

    - name: Explain an auth failure
      if: failure() && steps.ssh.outcome == 'failure'
      shell: bash
      env:
        GCP_VM_USER: ${{ inputs.username }}
      run: |
        cat <<MSG
        ::error::SSH deploy failed. If the log says
        "unable to authenticate, attempted methods [none publickey]", the key
        parsed and was offered — the VM refused it. Nothing in this repo can fix
        that; the deploy key has to be installed on the VM.

        The step above printed the public half of GCP_VM_SSH_KEY. Append that
        exact line to /home/${GCP_VM_USER}/.ssh/authorized_keys on the VM
        (chmod 700 ~/.ssh, chmod 600 ~/.ssh/authorized_keys), then re-run.

        Other causes, in order of likelihood:
          - GCP_VM_USER is not the user that owns that authorized_keys file
          - the VM has OS Login enabled, which ignores ~/.ssh/authorized_keys
          - the key has a passphrase but GCP_VM_SSH_PASSPHRASE is unset

        Full runbook: docs/workdocs_fix_gcp_ssh_auth_05082026/README.md
        Deploy by hand meanwhile: ssh to the VM, cd /opt/gas-tam-de,
        git pull origin stag, then ./scripts/vps-compose-up.sh
        MSG
