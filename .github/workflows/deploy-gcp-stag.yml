# Deploy to GCP VM after backend images are built and pushed to GHCR.
# Web image deploy is handled inside web-image.yml (needs: build-push).
# This workflow covers pushes that only touch Go services / compose / env.
#
# Secrets required (Settings → Secrets → Actions):
#   GCP_VM_HOST       — external IP of the GCP VM (e.g. 34.42.69.194)
#   GCP_VM_USER       — SSH user on the VM (e.g. ubuntu)
#   GCP_VM_SSH_KEY    — private key matching ~/.ssh/authorized_keys on the VM
# Optional:
#   GCP_VM_SSH_PASSPHRASE — if the private key was generated with a passphrase
#
# Troubleshooting auth failures:
#   docs/workdocs_fix_gcp_ssh_auth_05082026/README.md

name: Deploy → GCP stag

on:
  # Triggered after backend-ci finishes on stag (covers Go-only changes).
  workflow_run:
    workflows: ["Backend CI — build & push images"]
    branches: [stag]
    types: [completed]

  workflow_dispatch:

jobs:
  deploy:
    name: SSH deploy to GCP stag
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: SSH deploy
        uses: ./.github/actions/ssh-deploy-gcp
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          passphrase: ${{ secrets.GCP_VM_SSH_PASSPHRASE }}
          script: |
            set -euo pipefail
            cd /opt/gas-tam-de

            echo "==> git pull stag"
            git fetch origin stag
            git checkout stag
            git pull origin stag

            echo "==> docker compose pull"
            export COMPOSE_PROJECT_NAME="gas-tamde-stag"
            export PROXY_NETWORK="tensorship-net"
            docker compose \
              -f deploy/docker-compose.yml \
              -f deploy/docker-compose.local.yml \
              --env-file deploy/.env \
              -p "${COMPOSE_PROJECT_NAME}" \
              pull

            echo "==> docker compose up"
            docker compose \
              -f deploy/docker-compose.yml \
              -f deploy/docker-compose.local.yml \
              --env-file deploy/.env \
              -p "${COMPOSE_PROJECT_NAME}" \
              up -d --no-build --remove-orphans

            echo "==> health check"
            sleep 5
            curl -sf http://127.0.0.1:80/gateway-healthz && echo " gateway OK" || echo " gateway NOT OK"
            curl -sf http://127.0.0.1:80/v1/hello && echo " api OK" || echo " api NOT OK"

            docker compose -p "${COMPOSE_PROJECT_NAME}" ps -a
