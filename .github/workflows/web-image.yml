# Website image CI — build the Flutter Web + nginx image and push it to GHCR.
#
# deploy/docker-compose.yml pins `image: ghcr.io/<owner>/gas-tam-de/web:stag`
# for the `web` service, and the VPS deploys with `docker compose up --no-build`.
# Backend CI only builds the eight Go services, so without this workflow the
# `web` image never exists in the registry and the deploy fails to pull it —
# leaving the website (and the containers compose never got to start) missing.
#
# Kept separate from backend-ci.yml because the Flutter build is slow and is
# only invalidated by apps/mobile + the web Dockerfile / nginx config.
#
# GHCR visibility: same rule as backend-ci.yml. The package defaults to private;
# either flip it to public once in the GitHub UI or set the repo secret
# GHCR_WRITE_TOKEN (PAT with write:packages) so the last step does it.

name: Web image — build & push

on:
  push:
    branches: [stag, master]
    paths:
      - "apps/mobile/**"
      - "deploy/Dockerfile.web"
      - "deploy/nginx.web.conf"
      - "deploy/docker-entrypoint.web.sh"
      - ".github/workflows/web-image.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - "deploy/Dockerfile.web"
      - "deploy/nginx.web.conf"
      - "deploy/docker-entrypoint.web.sh"
      - ".github/workflows/web-image.yml"
  # Lets an operator rebuild :stag after a deploy found the tag missing.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/gas-tam-de/web

jobs:
  build-push:
    name: Build & push web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/stag' }}

      - name: Build (and push outside PRs)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.web
          # Empty API_BASE_URL = same-origin calls proxied by nginx.
          build-args: |
            API_BASE_URL=
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # NOTE: do not use `secrets.*` in `if:` — GHA rejects the workflow file
      # and no job ever runs. Check the token inside the script instead.
      - name: Make GHCR package public (requires GHCR_WRITE_TOKEN secret)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GHCR_WRITE_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "GHCR_WRITE_TOKEN not set — skip making package public"
            exit 0
          fi
          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/user/packages/container/gas-tam-de%2Fweb" \
            -f visibility=public
