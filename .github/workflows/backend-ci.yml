# Go backend CI — build Docker images and push to GHCR on every push to stag.
#
# The VPS deploys with `docker compose up --no-build`, so it needs pre-built
# images. This workflow builds every service image from the latest stag code and
# publishes to ghcr.io/haoma24/gas-tam-de/<service>:stag (and :latest).
#
# VPS deploy/.env (or env vars) must set:
#   IMAGE_PREFIX=ghcr.io/haoma24/gas-tam-de
#   IMAGE_TAG=stag
#
# No secrets required beyond the default GITHUB_TOKEN (GHCR write is automatic
# for the repo owner when the package visibility is set to public).

name: Backend CI — build & push images

on:
  push:
    branches: [stag, master]
    paths:
      - "services/**"
      - "pkg/**"
      - "go.mod"
      - "go.sum"
      - "deploy/Dockerfile.service"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "services/**"
      - "pkg/**"
      - "go.mod"
      - "go.sum"
      - "deploy/Dockerfile.service"

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/gas-tam-de

jobs:
  # ── 1. Go tests ──────────────────────────────────────────────────────────────
  test:
    name: Go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go test
        run: go test ./...

  # ── 2. Build + push images ───────────────────────────────────────────────────
  build-push:
    name: Build & push ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: test
    # Only push on real branch pushes, not PRs (PRs still build to validate)
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            port: "8080"
          - service: auth-service
            port: "8081"
          - service: catalog-service
            port: "8082"
          - service: geo-service
            port: "8083"
          - service: order-service
            port: "8084"
          - service: inventory-service
            port: "8085"
          - service: billing-service
            port: "8086"
          - service: report-service
            port: "8087"

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/stag' }}

      - name: Build (and push on branch push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.service
          build-args: |
            SERVICE=${{ matrix.service }}
            EXPOSE_PORT=${{ matrix.port }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
