# Go backend CI — build Docker images and push to GHCR on every push to stag.
#
# The VPS deploys with `docker compose up --no-build`, so it needs pre-built
# images. This workflow builds every service image from the latest stag code and
# publishes them to ghcr.io/haoma24/gas-tam-de/<service>:stag (and :latest).
# Image names are hardcoded in deploy/docker-compose.yml — no IMAGE_* env needed.
#
# GHCR package visibility:
#   New packages default to private. To let the VPS pull without credentials,
#   either make each package public once (GitHub → haoma24 → Packages →
#   Package settings → Change visibility) OR add a read-only PAT to the VPS:
#     docker login ghcr.io -u haoma24 -p <PAT_WITH_read:packages>
#   The PAT approach requires this once on the VPS; credentials persist in
#   ~/.docker/config.json across deploys.
#
# Optional: if the repo secret GHCR_WRITE_TOKEN is set (a PAT owned by
# haoma24 with write:packages scope), this workflow will automatically flip
# each package to public so no credentials are needed on the VPS at all.

name: Backend CI — build & push images

on:
  push:
    branches: [stag, master]
    paths:
      - "services/**"
      - "pkg/**"
      - "go.mod"
      - "go.sum"
      - "deploy/Dockerfile.service"
      - "deploy/docker-compose.yml"
      - "deploy/.env.example"
      - "deploy/.env.vps.example"
      - "scripts/check-env-yaml-safe.sh"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "services/**"
      - "pkg/**"
      - "go.mod"
      - "go.sum"
      - "deploy/Dockerfile.service"
      - "deploy/docker-compose.yml"
      - "deploy/.env.example"
      - "deploy/.env.vps.example"
      - "scripts/check-env-yaml-safe.sh"
  # Lets an operator re-run build + deploy without pushing an empty commit.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/gas-tam-de

jobs:
  # ── 1. Go tests ──────────────────────────────────────────────────────────────
  test:
    name: Go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go test
        run: go test ./...

      - name: check .env.example YAML-safe for Cursor Cloud override
        run: ./scripts/check-env-yaml-safe.sh

  # ── 2. Build + push images ───────────────────────────────────────────────────
  build-push:
    name: Build & push ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: test
    # Only push on real branch pushes, not PRs (PRs still build to validate)
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            port: "8080"
          - service: auth-service
            port: "8081"
          - service: catalog-service
            port: "8082"
          - service: geo-service
            port: "8083"
          - service: order-service
            port: "8084"
          - service: inventory-service
            port: "8085"
          - service: billing-service
            port: "8086"
          - service: report-service
            port: "8087"

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/stag' }}

      - name: Build (and push on branch push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.service
          build-args: |
            SERVICE=${{ matrix.service }}
            EXPOSE_PORT=${{ matrix.port }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Make package public so VPS can pull without credentials.
      # Requires repo secret GHCR_WRITE_TOKEN = PAT owned by haoma24 with
      # write:packages scope. Without the secret this step is skipped — see
      # workflow header for the manual alternative.
      # NOTE: do not use `secrets.*` in `if:` — GHA rejects the workflow
      # ("failed because of a workflow file issue") and CI never runs jobs.
      - name: Make GHCR package public (requires GHCR_WRITE_TOKEN secret)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GHCR_WRITE_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "GHCR_WRITE_TOKEN not set — skip making package public"
            exit 0
          fi
          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/user/packages/container/gas-tam-de%2F${{ matrix.service }}" \
            -f visibility=public

  # ── 3. Deploy ────────────────────────────────────────────────────────────────
  # Chained here rather than kept in a standalone workflow: a `workflow_run` or
  # `workflow_dispatch` trigger only fires when the workflow file exists on the
  # default branch (master), and the deploy config lives on stag only — so the
  # old deploy-gcp-stag.yml never ran. web-image.yml chains its deploy the same
  # way; the reusable workflow's concurrency group serializes the two.
  deploy-gcp:
    name: Deploy to GCP stag
    needs: build-push
    if: >-
      github.ref == 'refs/heads/stag' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/deploy-stag.reusable.yml
    with:
      trigger: backend-ci
    secrets: inherit
